name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Convert text files to TSV and run TSV checks
        run: python txt_to_tsv.py

      - name: Create lexicon statistics table
        run: python lexicon_statistics.py > ./lexicon_statistics.md

      - name: Check that the TSV files are valid
        run: python test_all_collections.py

      - name: Check that the generated files are up to date
        run: |
          if [ -n "$(git status --porcelain -- '*.tsv' lexicon_statistics.md)" ]; then
            git status --short -- '*.tsv' lexicon_statistics.md
            echo "::error::Generated files are out of date. Run 'python txt_to_tsv.py' and 'python lexicon_statistics.py > ./lexicon_statistics.md', then commit the result."
            exit 1
          fi
